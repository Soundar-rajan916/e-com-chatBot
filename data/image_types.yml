# Controlled Vocabulary for Product Image Pipeline
# Each type defines:
#   id: canonical product_type identifier
#   display_name: human-readable name
#   allowed_categories: list of categories where this type can appear
#   search_queries: queries used to fetch candidate stock images from provider API
#   synonyms: keywords/phrases in product titles mapped to this type
#   negative_terms: terms that disqualify a candidate image
#   allow_person: whether images with people are acceptable (e.g. models wearing shirts vs standalone cufflinks)

types:
  # --- ACCESSORIES ---
  - id: cufflinks
    display_name: "Cufflinks"
    allowed_categories: ["accessories"]
    search_queries: ["silver cufflinks", "men cufflinks jewelry", "formal cufflinks"]
    synonyms: ["cufflink", "cufflinks", "silver cufflinks", "royal silver cufflinks", "french cufflinks"]
    negative_terms: ["wristwatch", "wrist watch", "bracelet", "woman wrist", "backpack", "necklace"]
    allow_person: false

